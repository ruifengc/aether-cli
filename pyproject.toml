[project]
name = "aether-cli"
version = "0.1.1"
description = "Terminal application built on the Aether LLM runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aether[live] @ git+https://github.com/ruifengc/aether.git@7141a3d9ca0139a1b60018b0c866f74a63000f9b", "prompt-toolkit>=3.0,<4"]

[project.urls]
Repository = "https://github.com/ruifengc/aether-cli"
Issues = "https://github.com/ruifengc/aether-cli/issues"

[project.scripts]
aether = "aether_cli.app:cli"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aether_cli", "aether_cli.*"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
